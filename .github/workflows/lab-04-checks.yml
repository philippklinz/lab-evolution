name: Evolution laboratory browser checks

on:
  push:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'tests/**'
      - '.github/workflows/lab-04-checks.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'tests/**'
      - '.github/workflows/lab-04-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium / responsive + six experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check every HTML page at 12 widths
        run: node tests/layout-check.mjs
      - name: Verify six learning experiments
        run: node tests/interactions-check.mjs
